services:
  postgres:
    image: postgres:18.3-alpine3.22
    # image: dhi.io/postgres:18.3-alpine3.22
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todos
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      # dockerfile: Dockerfile.dhi-multistage
      # dockerfile: Dockerfile.dhi-sfw
    ports:
      - "3000:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todos
    depends_on:
      postgres:
        condition: service_healthy
